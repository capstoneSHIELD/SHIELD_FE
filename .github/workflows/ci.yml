name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# 한 PR 에 여러 push 가 일어나면 직전 실행을 취소.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    name: Lint · Build · Unit test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build
        env:
          VITE_API_URL: https://api.shieldai.kr

      - name: Unit tests (vitest)
        run: npm test
